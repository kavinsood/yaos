name = "yaos"
main = "src/worker.ts"
# DECISIONS-GAP: 2026-04-07 is the date `web_socket_auto_reply_to_close` defaults on (relay-wire close handshake).
compatibility_date = "2026-04-07"

# One vault DO per vault (`idFromName(vaultId)`) and one config DO (`idFromName("config")`), DECISIONS §2.1.
[[durable_objects.bindings]]
name = "YAOS_VAULT"
class_name = "VaultDO"

[[durable_objects.bindings]]
name = "YAOS_CONFIG"
class_name = "ConfigDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultSyncServer", "ServerConfig"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecoveryJob"]

# DECISIONS §1 (fresh deploy, no data migration) and §9 P5: v3 deletes the legacy classes and their data, v4 adds the
# new ones. Two tags because the API counts a migration's new classes before its deletions against the 500-namespace
# cap (error 10067); an account at the cap applies v3 alone first (P5). Elsewhere one deploy applies both.
[[migrations]]
tag = "v3"
deleted_classes = ["VaultSyncServer", "ServerConfig", "RecoveryJob"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["VaultDO", "ConfigDO"]

# console.ts inlines qrcode-generator's browser build in the console page (DECISIONS O12): this rule bundles the file
# as its source text. `fallthrough` keeps wrangler's default Text globs.
[[rules]]
type = "Text"
globs = ["qrcode-generator/dist/qrcode.js"]
fallthrough = true

[[r2_buckets]]
binding = "YAOS_BUCKET"
bucket_name = "yaos"

[observability.logs]
enabled = true

# ---------------------------------------------------------------------------
# Debug route gating
# ---------------------------------------------------------------------------
#
# YAOS_DEBUG_ROUTES = "1" enables POST /vault/:id/debug/simulate-daily-limit (test deployments only). When absent the
# route is 404 and the vault DO is not called.
#
# [vars]
# YAOS_DEBUG_ROUTES = "1"
