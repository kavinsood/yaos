name = "yaos"
main = "src/index.ts"
compatibility_date = "2026-03-02"

[[durable_objects.bindings]]
name = "YAOS_SYNC"
class_name = "VaultSyncServer"

[[durable_objects.bindings]]
name = "YAOS_CONFIG"
class_name = "ServerConfig"

[[durable_objects.bindings]]
name = "YAOS_RECOVERY_JOBS"
class_name = "RecoveryJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultSyncServer", "ServerConfig"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecoveryJob"]

[[r2_buckets]]
binding = "YAOS_BUCKET"
bucket_name = "yaos"

[observability.logs]
enabled = true

# ---------------------------------------------------------------------------
# Admin / debug route gating
# ---------------------------------------------------------------------------
#
# Uncomment YAOS_ENABLE_ADMIN_ROUTES to expose the destructive compact route.
# The route remains operator-session authenticated when enabled. When absent
# or empty it returns 404 without waking the vault Durable Object.
#
# [vars]
# YAOS_ENABLE_ADMIN_ROUTES = "true"
