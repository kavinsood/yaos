name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm run build:server-node
      - run: npm run typecheck:tests
      - run: npm run typecheck:qa
      - run: npm run typecheck:cli
      - run: npm run typecheck:server-node
      - run: npm run guard:no-any
      - run: npm run guard:production-bundles
      - run: npm run guard:no-tracked-generated-artifacts
      - run: npm run test:ci
      - run: npm --prefix server run typecheck
