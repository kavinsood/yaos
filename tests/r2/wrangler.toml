name = "yaos-p0k-r2-probe"
main = "probe.ts"
compatibility_date = "2026-03-02"

[alias]
"@yaos/crdt-engine" = "../../server/src/crdt/ywasmWorkerCrdtEngine.ts"

[[durable_objects.bindings]]
name = "PROBE_VAULTS"
class_name = "R2ProbeVault"

[[durable_objects.bindings]]
name = "PROBE_CONFIG"
class_name = "R2ProbeConfig"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["R2ProbeVault", "R2ProbeConfig"]

[observability]
enabled = false
